name: Update AltStore Source

on:
  workflow_dispatch:
  schedule:
    # GitHub Actions 的 cron 使用 UTC 时间；这里每日检查一次
    - cron: "0 2 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Update source.json from upstream GitHub Releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/update_altstore_source.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add source.json
          if ! git diff --cached --quiet; then
            git commit -m "Update AltStore source"
            git push
          fi
